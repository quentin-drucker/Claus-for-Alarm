.needles:after{transform:rotate(-3deg);background:#c98f55}
.plate{position:relative;max-width:95%;padding:9px 30px;background:#1f5a43;border:4px solid #0d1322;box-shadow:inset 0 0 0 2px #5c77ab,0 5px #0d1322;font:clamp(18px,2.8vw,32px)/1.15 Rocker,Georgia,serif;color:#f9c96d;text-shadow:2px 2px #0d1322;transform:scale(.8);opacity:0;animation:plate-in .4s 1.5s forwards}
.plate:before,.plate:after{content:'●';position:absolute;top:50%;transform:translateY(-50%);font:14px Arial;color:#f9c96d;text-shadow:1px 1px #fff8ee}.plate:before{left:9px}.plate:after{right:9px}
.mascot{min-height:0;flex:1;width:200px;max-width:30vw;object-fit:contain;filter:drop-shadow(0 6px 0 #0d132244);animation:mascot-in .55s 1.4s both}
.loading{width:min(600px,80vw);text-align:center;font:16px/1.4 system-ui,sans-serif;font-weight:600;text-shadow:1px 2px #3c1720}

#details{font-size:12px;font-weight:400;color:#f4ddd7;min-height:1.4em}
#error{display:none;margin:10px auto;padding:12px;background:#1a2438;border:2px solid #f9c96d;max-width:90vw;white-space:pre-wrap;text-shadow:none}
#error button{padding:8px 20px;cursor:pointer;margin-top:8px;font:inherit;color:#fff8ee;background:#20517a;border:2px solid #f9c96d}
@keyframes knit{to{clip-path:inset(0)}}
@keyframes needle-pass{0%{top:100%;opacity:1}90%{top:0;opacity:1}100%{top:0;opacity:0}}
@keyframes hat-drop{to{transform:translateY(0) rotate(-15deg)}}
@keyframes plate-in{to{transform:scale(1);opacity:1}}
@keyframes mascot-in{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes roll{to{transform:rotate(360deg)}}
@media(max-height:450px){.composition{inset:9% 3% 12%;gap:7px}.mascot{display:none}h1{font-size:min(7.5vw,60px)}.plate{font-size:20px}.band{height:18px;background-size:auto 18px}.loading{font-size:13px}}

<noscript><p style="position:fixed;z-index:20;top:50%;background:#1a2438;color:white;padding:20px">Enable JavaScript to play Claus for Alarm.</p></noscript>
<script>
// Defined before the engine loads: title_screen.gd calls this after its first rendered frame.
const STARTUP_READY_HOLD_MS = 4000;
window.clausMenuReady = function () {
 const overlay = document.getElementById('startup');
 if (!overlay || overlay.dataset.failed || overlay.dataset.ready) return;
 overlay.dataset.ready = 'true';
 // Give the title/hat time to reveal even on cached loads or after a startup stall.
 document.fonts.ready.then(function () {
  if (!overlay.isConnected || overlay.dataset.failed) return;
  document.getElementById('stage').textContent = 'Ready! Opening the Christmas village…';
  document.getElementById('details').textContent = '';
  setTimeout(function () {
   if (!overlay.isConnected || overlay.dataset.failed) return;
   overlay.classList.add('done');
   setTimeout(() => {overlay.remove(); document.getElementById('canvas').focus();}, 360);
  }, STARTUP_READY_HOLD_MS);
 });
};
window.clausLoadFailure = function (error) {
 const overlay = document.getElementById('startup');
 if (!overlay) return;
 overlay.dataset.failed = 'true';
 document.getElementById('stage').textContent = 'The game could not start';
 document.getElementById('details').textContent = '';
 document.getElementById('error-message').textContent = String(error.message || error);
 document.getElementById('error').style.display = 'block';
};
</script>
<script src="$GODOT_URL" onerror="clausLoadFailure('Could not download the game engine. Check your connection and try again.')"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
 if (typeof Engine === 'undefined') return;
 const missing = Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
 if (missing.length) {clausLoadFailure('Your browser is missing: ' + missing.join(', ')); return;}
 const engine = new Engine(GODOT_CONFIG);
 engine.startGame({onProgress:function(current,total) {
  const stage = document.getElementById('stage');
  if (!stage) return;
  if (total > 0) {
   const p = Math.min(1, current / total);
   document.querySelector('.scarf').style.width = (p*100)+'%';
   document.querySelector('.yarn').style.left = (p*100)+'%';
   document.querySelector('.scarf-track').setAttribute('aria-valuenow',String(Math.round(p*100)));
   stage.textContent = p < 1 ? 'Knitting your loading screen… '+Math.floor(p*100)+'%' : 'Preparing the Christmas village…';
   document.getElementById('details').textContent = p < 1 ? (current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB' : 'First visits can take a little longer';
  }
 }}).then(function () {
  const stage = document.getElementById('stage');
  if (stage) stage.textContent = 'Opening the Christmas village…';
 }, window.clausLoadFailure);
})();
</script>
