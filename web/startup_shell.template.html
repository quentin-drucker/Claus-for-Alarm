<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<style>
@font-face{font-family:Bowlby;src:url('@@BowlbyOne-Regular.ttf@@') format('truetype');font-display:swap}
@font-face{font-family:Rocker;src:url('@@NewRocker-latin.woff2@@') format('woff2');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8e1f2e}
#canvas{display:block;width:100%;height:100%;outline:none}
#startup{position:fixed;inset:0;z-index:10;overflow:hidden;color:#fff8ee;background:#8e1f2e url('@@knit_red.png@@');transition:opacity .35s ease;isolation:isolate}
#startup.done{opacity:0;pointer-events:none}
#startup[data-phase="map"] .scarf{width:100%;animation:scarf-drift 2s linear infinite}
#startup[data-phase="map"] .yarn{left:50%}
@keyframes scarf-drift{to{background-position:52px center}}
.band{position:absolute;left:0;right:0;height:30px;background:url('@@fair_isle_big.png@@') repeat-x;image-rendering:pixelated;opacity:.85}
.top{top:3.5%}.bottom{bottom:3.5%}
.composition{position:absolute;inset:11% 3% 13%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px}
.logo-wrap{position:relative;width:max-content;max-width:96%;margin-top:2vh}
h1{margin:0;color:#f4f8ff;font:clamp(26px,7.8vw,100px)/1.25 Bowlby,Arial,sans-serif;white-space:nowrap;letter-spacing:-.025em;-webkit-text-stroke:8px #0d1322;paint-order:stroke fill;text-shadow:0 7px 0 #0d1322;clip-path:inset(100% 0 0);animation:knit 1.5s .15s steps(12,end) forwards}
.hat{position:absolute;width:12%;height:110%;object-fit:contain;left:1%;top:-60%;transform:translateY(-50vh) rotate(25deg);transform-origin:50% 90%;animation:hat-drop .65s 1.65s cubic-bezier(.2,.9,.3,1.2) forwards}
.needles{position:absolute;left:10%;right:10%;top:0;animation:needle-pass 1.65s forwards;pointer-events:none}
.needles:before,.needles:after{content:'';position:absolute;left:0;right:0;height:6px;background:#d9a56a;border-radius:4px;transform:rotate(3deg);box-shadow:0 2px #8a5a33}
.needles:after{transform:rotate(-3deg);background:#c98f55}
.plate{position:relative;max-width:95%;padding:9px 30px;background:#1f5a43;border:4px solid #0d1322;box-shadow:inset 0 0 0 2px #5c77ab,0 5px #0d1322;font:clamp(18px,2.8vw,32px)/1.15 Rocker,Georgia,serif;color:#f9c96d;text-shadow:2px 2px #0d1322;transform:scale(.8);opacity:0;animation:plate-in .4s 1.5s forwards}
.plate:before,.plate:after{content:'●';position:absolute;top:50%;transform:translateY(-50%);font:14px Arial;color:#f9c96d;text-shadow:1px 1px #fff8ee}.plate:before{left:9px}.plate:after{right:9px}
.mascot{min-height:0;flex:1;width:200px;max-width:30vw;object-fit:contain;filter:drop-shadow(0 6px 0 #0d132244);animation:mascot-in .55s 1.4s both}
.loading{width:min(600px,80vw);text-align:center;font:16px/1.4 system-ui,sans-serif;font-weight:600;text-shadow:1px 2px #3c1720}
.scarf-track{position:relative;height:30px;margin:12px 0;background:#0d132255;border:2px solid #f4e6d466;border-radius:4px}
.scarf{height:100%;width:0;background:url('@@fair_isle_big.png@@') center/auto 24px repeat-x,url('@@knit_overlay.png@@'),#1f5a43;transition:width .2s linear}
.yarn{position:absolute;width:38px;height:38px;top:-6px;left:0;margin-left:-19px;border-radius:50%;background:repeating-linear-gradient(60deg,#f4e6d4 0 4px,#d9c3a8 4px 7px);box-shadow:0 4px #0d132255;animation:roll 2s linear infinite;transition:left .2s linear}
#details{font-size:12px;font-weight:400;color:#f4ddd7;min-height:1.4em}
#error{display:none;margin:10px auto;padding:12px;background:#1a2438;border:2px solid #f9c96d;max-width:90vw;white-space:pre-wrap;text-shadow:none}
#error button{padding:8px 20px;cursor:pointer;margin-top:8px;font:inherit;color:#fff8ee;background:#20517a;border:2px solid #f9c96d}
@keyframes knit{to{clip-path:inset(0)}}
@keyframes needle-pass{0%{top:100%;opacity:1}90%{top:0;opacity:1}100%{top:0;opacity:0}}
@keyframes hat-drop{to{transform:translateY(0) rotate(-15deg)}}
@keyframes plate-in{to{transform:scale(1);opacity:1}}
@keyframes mascot-in{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes roll{to{transform:rotate(360deg)}}
@media(max-height:450px){.composition{inset:9% 3% 12%;gap:7px}.mascot{display:none}h1{font-size:min(7.5vw,60px)}.plate{font-size:20px}.band{height:18px;background-size:auto 18px}.loading{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}h1{clip-path:none}.hat{transform:rotate(-15deg)}.plate{opacity:1;transform:none}.needles{display:none}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser needs canvas support to play.</canvas>
<div id="startup" aria-label="Claus for Alarm loading">
 <div class="band top"></div><div class="band bottom"></div>
 <div class="composition">
  <div class="logo-wrap"><h1>Claus for Alarm</h1><div class="needles"></div><img class="hat" alt="" src="@@hat_santa.png@@"></div>
  <div class="plate">A winter-sports tower defense</div>
  <img class="mascot" alt="" src="@@claus_3q.png@@">
  <div class="loading"><div id="stage" role="status" aria-live="polite">Knitting your loading screen…</div>
   <div class="scarf-track" role="progressbar" aria-label="Game download" aria-valuemin="0" aria-valuemax="100"><div class="scarf"></div><div class="yarn"></div></div>
   <div id="details">Getting the game ready</div>
   <div id="error" role="alert"><div id="error-message"></div><button onclick="location.reload()">Try again</button></div>
  </div>
 </div>
</div>
<noscript><p style="position:fixed;z-index:20;top:50%;background:#1a2438;color:white;padding:20px">Enable JavaScript to play Claus for Alarm.</p></noscript>
<script>
// Defined before the engine loads: title_screen.gd calls this after its first rendered frame.
const STARTUP_READY_HOLD_MS = 4000;
const startupTemplate = document.getElementById('startup').cloneNode(true);
function dismissLoading(overlay) {
 if (!overlay.isConnected || overlay.dataset.failed) return;
 overlay.classList.add('done');
 setTimeout(() => {overlay.remove(); document.getElementById('canvas').focus();}, 360);
}
window.clausShowMapLoading = function () {
 if (document.getElementById('startup')) return;
 const overlay = startupTemplate.cloneNode(true);
 overlay.dataset.phase = 'map';
 overlay.dataset.shownAt = String(performance.now());
 overlay.querySelector('#stage').textContent = 'Preparing the ski course...';
 overlay.querySelector('#details').textContent = 'Getting the map and defenders ready';
 overlay.querySelector('.scarf-track').setAttribute('aria-label', 'Preparing the ski course');
 document.body.appendChild(overlay);
};
window.clausMapReady = function () {
 const overlay = document.getElementById('startup');
 if (!overlay || overlay.dataset.phase !== 'map' || overlay.dataset.ready) return;
 overlay.dataset.ready = 'true';
 // Let this reuse finish its title/hat reveal too, even when the map is cached.
 const remaining = Math.max(0, 2700 - (performance.now() - Number(overlay.dataset.shownAt)));
 setTimeout(() => dismissLoading(overlay), remaining);
};
window.clausMenuReady = function () {
 const overlay = document.getElementById('startup');
 if (!overlay || overlay.dataset.failed || overlay.dataset.ready) return;
 overlay.dataset.ready = 'true';
 // Give the title/hat time to reveal even on cached loads or after a startup stall.
 document.fonts.ready.then(function () {
  if (!overlay.isConnected || overlay.dataset.failed) return;
  document.getElementById('stage').textContent = 'Ready! Opening the Christmas village…';
  document.getElementById('details').textContent = '';
  setTimeout(function () {
   if (!overlay.isConnected || overlay.dataset.failed) return;
   dismissLoading(overlay);
  }, STARTUP_READY_HOLD_MS);
 });
};
window.clausLoadFailure = function (error) {
 const overlay = document.getElementById('startup');
 if (!overlay) return;
 overlay.dataset.failed = 'true';
 document.getElementById('stage').textContent = 'The game could not start';
 document.getElementById('details').textContent = '';
 document.getElementById('error-message').textContent = String(error.message || error);
 document.getElementById('error').style.display = 'block';
};
</script>
<script src="$GODOT_URL" onerror="clausLoadFailure('Could not download the game engine. Check your connection and try again.')"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
 if (typeof Engine === 'undefined') return;
 const missing = Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
 if (missing.length) {clausLoadFailure('Your browser is missing: ' + missing.join(', ')); return;}
 const engine = new Engine(GODOT_CONFIG);
 engine.startGame({onProgress:function(current,total) {
  const stage = document.getElementById('stage');
  if (!stage) return;
  if (total > 0) {
   const p = Math.min(1, current / total);
   document.querySelector('.scarf').style.width = (p*100)+'%';
   document.querySelector('.yarn').style.left = (p*100)+'%';
   document.querySelector('.scarf-track').setAttribute('aria-valuenow',String(Math.round(p*100)));
   stage.textContent = p < 1 ? 'Knitting your loading screen… '+Math.floor(p*100)+'%' : 'Preparing the Christmas village…';
   document.getElementById('details').textContent = p < 1 ? (current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB' : 'First visits can take a little longer';
  }
 }}).then(function () {
  const stage = document.getElementById('stage');
  if (stage) stage.textContent = 'Opening the Christmas village…';
 }, window.clausLoadFailure);
})();
</script>
</body>
</html>
